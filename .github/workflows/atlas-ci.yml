name: atlas-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_overwrite:
        description: 'Type YES to publish a version LOWER than the one on npm (a backport to an older line). It goes out under the backport dist-tag, so latest does not move. A version npm already holds can never be published again: bump it instead.'
        required: false
        default: 'no'

permissions:
  contents: read

concurrency:
  # Differentiated by event_name so a workflow_dispatch publish run is not
  # cancelled by a subsequent push to main mid-flight. And a dispatch never
  # cancels another one: a second "Run workflow" on the same ref used to stop
  # the first wherever it was, between `npm publish` and the release included,
  # leaving a version on npm that no rerun could finish (the drift gate then
  # refuses it as already published). Dispatch runs queue; pushes and pull
  # requests still supersede each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:

  # The cross-platform matrix below exists to produce the prebuilt binaries a
  # release ships. Running it on every push to main costs five runners to
  # rebuild what nobody downloads, so it is gated on the package version
  # actually moving. Typecheck, lint and the test jobs are NOT gated: they run
  # on every push, on ubuntu, building the host binary themselves.
  #
  # `workflow_dispatch` always passes the gate — that is how a release is cut —
  # and so does anything else that is not a push.
  version-gate:
    name: Version bumped?
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # HEAD^ is what the version is read from for the comparison.
          fetch-depth: 2
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != 'push' ]; then
            echo 'bumped=true' >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.event_name }} — the matrix runs unconditionally"
            exit 0
          fi
          # A missing HEAD^ (first commit on a fresh clone depth) leaves an
          # empty previous version, which reads as a bump — the matrix runs.
          # Erring towards building is the safe direction here.
          git show 'HEAD^:package.json' > "$RUNNER_TEMP/previous.json" 2>/dev/null \
            || echo '{}' > "$RUNNER_TEMP/previous.json"
          previous=$(node -p "require('$RUNNER_TEMP/previous.json').version ?? ''")
          current=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")
          if [ "$previous" = "$current" ]; then
            echo 'bumped=false' >> "$GITHUB_OUTPUT"
            echo "::notice::version unchanged ($current) — skipping the cross-platform matrix"
          else
            echo 'bumped=true' >> "$GITHUB_OUTPUT"
            echo "::notice::version $previous -> $current — building the cross-platform matrix"
          fi

  # Typecheck + lint quality gate — one ubuntu run (no matrix). Mirrors the
  # aggregate `verify:all` gate at the ream-dev root so a standalone clone of
  # this package enforces the same bar.
  quality:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.build.json --noEmit
      # And the tests: `tsconfig.build.json` leaves them out, so every type a
      # test relies on went ungated until this step ran the project's own
      # `tsconfig.json`, which includes them.
      - run: pnpm typecheck
      - run: pnpm lint
  # 5-platform NAPI matrix (Story 52.1). Atlas ships TWO NAPI artefacts:
  # `index.<suffix>.node` (atlas-query-napi) + `db.<suffix>.node` (atlas-db-napi).
  # Native runners only — no cross-compilation (cerebrum 2026-05-01).
  build-and-test:
    name: Build & test (${{ matrix.suffix }})
    needs: version-gate
    if: needs.version-gate.outputs.bumped == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    suffix: linux-x64-gnu,   target: x86_64-unknown-linux-gnu,  test: true }
          - { os: ubuntu-24.04-arm, suffix: linux-arm64-gnu, target: aarch64-unknown-linux-gnu, test: true }
          # darwin-x64 cross-compiled on arm64 (macos-13 scarce); build-only —
          # an x86_64 .node can't be loaded/tested on the arm64 runner.
          - { os: macos-15,         suffix: darwin-x64,      target: x86_64-apple-darwin,       test: false }
          - { os: macos-15,         suffix: darwin-arm64,    target: aarch64-apple-darwin,      test: true }
          - { os: windows-latest,   suffix: win32-x64-msvc,  target: x86_64-pc-windows-msvc,    test: true }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # Formatting is a gate, not a suggestion: left ungated, every one of these
      # crates drifted, and the drift is only ever noticed when it takes a
      # publish job down.
      - run: cargo fmt --check
      # And clippy, as an error rather than a note. `cargo fmt --check` was
      # gating the formatting while nothing gated the lints that catch a real
      # defect — the one place the compiler stays silent and clippy does not.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Two reporters on purpose: the JSON one feeds the smoke gate, the default
      # one is what a human reads. With JSON alone a failure printed an exit
      # code and not one word about which test failed.
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install

      - name: Build NAPI binaries (query + db)
        run: pnpm build:napi
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}

      - name: Vitest (unit only — integration runs in dedicated job with real DB)
        if: matrix.test
        run: pnpm exec vitest run tests/unit --reporter=verbose --reporter=default --reporter=json --outputFile=test-results.json
        shell: bash

      - name: Smoke gate — tests ran AND zero skipped (Linux/macOS)
        if: matrix.test && runner.os != 'Windows'
        run: |
          if [ ! -f test-results.json ]; then
            echo "::error::test-results.json not produced — pnpm test failed before writing"
            exit 1
          fi
          total=$(jq '[.testResults[].assertionResults[]] | length' test-results.json)
          if [ "$total" -eq 0 ]; then
            echo "::error::0 tests ran — test discovery is broken (check vitest include glob)"
            exit 1
          fi
          skipped=$(jq '[.testResults[].assertionResults[] | select(.status=="skipped")] | length' test-results.json)
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped tests skipped — check NAPI binary load path"
            exit 1
          fi
        shell: bash

      - name: Smoke gate — tests ran AND zero skipped (Windows)
        if: matrix.test && runner.os == 'Windows'
        run: |
          if (-not (Test-Path test-results.json)) {
            Write-Error "test-results.json not produced — pnpm test failed before writing"
            exit 1
          }
          $total = python -c "import json,sys; d=json.load(open(sys.argv[1])); print(sum(1 for r in d['testResults'] for a in r['assertionResults']))" test-results.json
          if ([int]$total -eq 0) {
            Write-Error "0 tests ran — test discovery is broken (check vitest include glob)"
            exit 1
          }
          $skipped = python -c "import json,sys; d=json.load(open(sys.argv[1])); print(sum(1 for r in d['testResults'] for a in r['assertionResults'] if a['status']=='skipped'))" test-results.json
          if ([int]$skipped -ne 0) {
            Write-Error "$skipped tests skipped — check NAPI binary load path"
            exit 1
          }
        shell: pwsh

      - name: Upload artefacts (query + db)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-napi-${{ matrix.suffix }}
          path: |
            index.${{ matrix.suffix }}.node
            db.${{ matrix.suffix }}.node
          if-no-files-found: error

  # Cargo tests run once on linux-x64-gnu — Rust logic is platform-independent.
  cargo-tests:
    name: Cargo tests (linux-x64-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --locked --workspace

  # Integration tests against real Postgres + MySQL instances. Linux-only —
  # GHA service containers are Linux-only. Covers gaps the SQL-string-only
  # unit suite can't: transaction isolation, driver-specific decode quirks,
  # migration atomicity, relation preloads end-to-end.
  #
  # Gated on cargo-tests (Linux) only — NOT the full 5-platform build-and-test
  # matrix — so a flaky Windows/macOS runner cannot block PG+MySQL coverage.
  integration:
    name: Integration (real DB)
    runs-on: ubuntu-latest
    needs: cargo-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: atlas_test
          POSTGRES_DB: atlas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: atlas_test
          MYSQL_DATABASE: atlas_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      ATLAS_TEST_PG_URL: postgres://postgres:atlas_test@localhost:5432/atlas_test
      ATLAS_TEST_MYSQL_URL: mysql://root:atlas_test@localhost:3306/atlas_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: '24' }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: pnpm install
      - name: Build NAPI binaries (query + db)
        run: pnpm build:napi
      # PostgreSQL over TLS with a client certificate. Not a service container:
      # the certificates are generated first, and the server is started on them.
      # The directory goes through GITHUB_ENV: `runner.temp` is not available
      # in a job's own `env`, and the workflow is rejected outright if it is.
      - name: Start PostgreSQL TLS
        run: |
          scripts/pg-tls-stack.sh start "$RUNNER_TEMP/pg-tls"
          echo "ATLAS_TEST_PG_TLS_DIR=$RUNNER_TEMP/pg-tls" >> "$GITHUB_ENV"
      # The whole suite, with coverage: this is the only job with the real
      # databases, so it is the only one that can reach every line — and the
      # thresholds in vitest.config.ts describe the whole suite, not a slice
      # of it. Running them over `tests/unit` alone gated nothing but noise.
      - name: Integration tests
        run: pnpm exec vitest run --coverage --reporter=default --reporter=json --outputFile=test-results.json
      # Every real-database suite is gated on an ATLAS_TEST_* variable and
      # skips without it. This job sets them all, so a skip here means one
      # did not arrive (a renamed variable, a GITHUB_ENV write that did not
      # happen, a service under another name) and the real-DB layer quietly
      # stopped running. The suites that cannot run on a standalone checkout
      # (the atom contract, the BlackGate bench) are excluded by
      # vitest.config.ts, not skipped, so the expected count is zero.
      - name: Integration gate — tests ran AND zero skipped
        if: always()
        run: |
          if [ ! -f test-results.json ]; then
            echo "::error::test-results.json not produced — vitest failed before writing"
            exit 1
          fi
          total=$(jq '[.testResults[].assertionResults[]] | length' test-results.json)
          if [ "$total" -eq 0 ]; then
            echo "::error::0 tests ran — test discovery is broken"
            exit 1
          fi
          skipped=$(jq -r '[.testResults[] | .name as $f | .assertionResults[] | select(.status=="skipped") | "\($f): \(.fullName)"]' test-results.json)
          count=$(jq 'length' <<<"$skipped")
          if [ "$count" -ne 0 ]; then
            echo "::error::$count real-database tests skipped — an ATLAS_TEST_* variable or a service is missing"
            jq -r '.[]' <<<"$skipped"
            exit 1
          fi
        shell: bash

  # vitest on the host platform, on every push. The matrix above runs the
  # same suite across five targets, but only when the version moves — so
  # without this job the TypeScript signal would disappear from an ordinary
  # push along with it. Builds its own napi binary rather than waiting on
  # the gated matrix for an artefact.
  ts-tests:
    name: TypeScript (vitest, linux-x64-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: pnpm install
      - run: pnpm build:napi
      - run: pnpm exec vitest run tests/unit

  # RustSec advisories against Cargo.lock, on every push and before every
  # publish. A lockfile nothing re-audits goes red silently: seven of them
  # had, on the hashing, TLS and sanitising paths, before this job existed.
  # Vulnerabilities and yanked crates fail it; unmaintained and unsound
  # notices are printed.
  audit:
    name: Advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Pinned and --locked: the auditor is itself a dependency of the release.
      - run: cargo install cargo-audit --locked --version 0.22.2
      # Accepted advisories, each with the reason it does not reach this
      # package. Anything not listed fails the job.
      #   RUSTSEC-2026-0459: libsqlite3-sys, through sqlx-sqlite. No sqlx-sqlite
      #     release builds against a patched libsqlite3-sys yet;
      #     drop this line when one does.
      - run: cargo audit --deny yanked --ignore RUSTSEC-2026-0459

  # Publish job — gated on workflow_dispatch (manual maintainer trigger).
  # Requires NPM_TOKEN secret + a v<MAJOR>.<MINOR>.<PATCH> tag at HEAD matching
  # package.json. Drift gate refuses a version npm already holds, and an older
  # one unless `confirm_overwrite=YES` (it then goes out as `backport`).
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Creating the release needs write; the workflow default is read.
      contents: write
      # The OIDC token npm signs the provenance with (and trusted publishing
      # authenticates with).
      id-token: write
    timeout-minutes: 15
    # `integration` is in this list because it was not, and a red integration
    # job published anyway: 0.3.10 went out with a failing real-DB test. The
    # failure was a test-isolation race rather than a defect, which is luck,
    # not a gate.
    needs: [quality, build-and-test, cargo-tests, ts-tests, integration, audit]
    if: github.event_name == 'workflow_dispatch'
    # A publish is a deployment to npm. The environment's protection rules
    # (required reviewer, deployments from v* tags only) are what stands
    # between one write-access account and a release, and npm trusted
    # publishing is bound to this name.
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify NPM_TOKEN secret
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret missing — set in repo settings before manual publish"
            exit 1
          fi

      - name: Tag-vs-package.json gate
        id: tag
        run: |
          tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$tag" ]; then
            echo "::error::HEAD has no v<MAJOR>.<MINOR>.<PATCH>-shaped tag — refuse to publish from an untagged commit"
            exit 1
          fi
          node_err=$(mktemp)
          if ! pkg_v=$(node -p "require('./package.json').version" 2>"$node_err"); then
            echo "::error::Failed to read package.json version: $(cat "$node_err")"
            rm -f "$node_err"; exit 1
          fi
          rm -f "$node_err"
          if [ -z "$pkg_v" ]; then
            echo "::error::package.json version field is empty"
            exit 1
          fi
          pkg_tag="v${pkg_v}"
          if [ "$tag" != "$pkg_tag" ]; then
            echo "::error::Tag $tag does not match package.json $pkg_tag — refuse to publish from a drifted tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag gate passed: $tag == $pkg_tag"

      - name: Drift fail-closed gate
        id: drift
        env:
          CONFIRM_OVERWRITE: ${{ inputs.confirm_overwrite }}
        run: |
          node_err=$(mktemp)
          if ! local_v=$(node -p "require('./package.json').version" 2>"$node_err"); then
            echo "::error::Failed to read package.json version: $(cat "$node_err")"
            rm -f "$node_err"; exit 1
          fi
          rm -f "$node_err"
          if [ -z "$local_v" ]; then
            echo "::error::package.json version field is empty"
            exit 1
          fi
          npm_err=$(mktemp)
          # `if` form so `set -e` (bash -e) does not abort the step when
          # `npm view` exits non-zero (e.g. E404 on a first publish) — a bare
          # assignment would die before `status=$?` and skip the E404 path.
          if npm_v=$(npm view --fetch-timeout=30000 @c9up/atlas version 2>"$npm_err"); then
            status=0
          else
            status=$?
          fi
          err=$(cat "$npm_err"); rm -f "$npm_err"
          if [ "$status" -ne 0 ]; then
            if echo "$err" | grep -qE 'E404|404 Not Found'; then
              npm_v=""
              echo "Drift gate: package not yet on registry — first-publish path"
            else
              echo "::error::Cannot reach npm registry — refuse to publish without a verified registry version. Output: $err"
              exit 1
            fi
          fi
          if [ -z "$npm_v" ]; then
            echo "Drift gate passed: first publish of @c9up/atlas (local $local_v)"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          highest=$(printf '%s\n%s\n' "$npm_v" "$local_v" | sort -V | tail -1)
          if [ "$local_v" = "$npm_v" ]; then
            # npm refuses a version it already holds (and one unpublished less than
            # 24 h ago), whatever this gate says, so no input can make this path
            # publish: it used to be let through on confirm_overwrite=YES and failed
            # one step later with E403.
            echo "::error::Local version $local_v is already on npm, which never accepts a version twice — bump package.json"
            exit 1
          elif [ "$highest" = "$npm_v" ]; then
            if [ "$CONFIRM_OVERWRITE" != "YES" ]; then
              echo "::error::Registry version $npm_v is newer than local $local_v — refuse to publish an older version without confirm_overwrite=YES"
              exit 1
            fi
            # An older number published as `latest` would move every fresh install
            # back to it; a backport goes out under its own dist-tag instead.
            echo "Override accepted: publishing $local_v under the 'backport' dist-tag; latest stays $npm_v"
            echo "dist_tag=backport" >> "$GITHUB_OUTPUT"
          else
            echo "Drift gate passed: local $local_v > registry $npm_v"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm install
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: atlas-napi-*
          merge-multiple: true

      # A publish missing a platform is worse than no publish: it installs
      # cleanly and then fails to load, on the machines least able to diagnose
      # it. The upload side refuses an empty artefact, but this job alone can be
      # rerun after the run's artefacts expired, or a suffix renamed on one side
      # only, and `files` then simply packs fewer binaries.
      - name: Every platform's binaries, or nothing goes out
        run: |
          missing=0
          for suffix in linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64 win32-x64-msvc; do
            for stem in index db; do
              if [ ! -f "${stem}.${suffix}.node" ]; then
                echo "::error::${stem}.${suffix}.node was not produced by the matrix"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          ls -la ./*.node

      # --provenance signs the tarball with this run's OIDC identity, so every
      # version can be traced to the commit and the workflow run that built it,
      # and the same files published from a laptop are told apart. --tag is the
      # drift gate's answer: `latest`, or `backport` for an older line.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.drift.outputs.dist_tag }}
        run: |
          if [ -z "$DIST_TAG" ]; then
            echo "::error::the drift gate produced no dist-tag — refuse to publish"
            exit 1
          fi
          pnpm publish --access public --no-git-checks --provenance --tag "$DIST_TAG"
      - name: Create the GitHub release
        # Notes from the commits this tag contains. Without it a published
        # version arrives with no explanation of what changed, and the only way
        # to find out is to read a diff.
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag the gate read off HEAD. `GITHUB_REF_NAME` is the branch on a
          # dispatch from main, so the `refs/tags/main` lookup failed and the
          # step exited 0 having created nothing: a version on npm, no notes.
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          if [ -z "$tag" ]; then
            echo "::error::the tag gate produced no tag — cannot create a release"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} is not in this checkout - refusing to guess the notes range"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists - leaving it alone"
            exit 0
          fi
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          range="${tag}"
          [ -n "$prev" ] && range="${prev}..${tag}"
          notes="$(git log "$range" --no-merges --format='### %s%n%n%b%n' \
            | grep -vE '^### [a-z0-9@/.-]+ [0-9]+\.[0-9]+\.[0-9]+$' || true)"
          [ -z "${notes// }" ] && notes="_Version bump only - no behavioural change._"
          [ -n "$prev" ] && notes="${notes}"$'\n\n---\n\n'"Changes since \`${prev}\`."
          printf '%s\n' "$notes" | gh release create "$tag" --title "$tag" --notes-file -
