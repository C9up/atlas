[package]
name = "atlas-db"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Async database driver for the Ream framework — SQLite, PostgreSQL, MySQL via sqlx"

[lib]
crate-type = ["lib"]

[dependencies]
# `mysql-rsa` is what MySQL 8 needs to authenticate at all. Its default plugin
# is caching_sha2_password, whose full-authentication step encrypts the password
# with the server's RSA public key on any connection that is not already TLS.
# sqlx 0.9 moved that behind a feature (#4142); without it every non-TLS MySQL 8
# connection fails at handshake. The advisory on the `rsa` crate is a timing
# sidechannel on DECRYPTION and does not reach this direction: the private key
# and the decryption both live in the MySQL server, never here.
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "postgres", "mysql", "mysql-rsa", "any", "json", "chrono", "uuid", "bigdecimal"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encode BLOB/BYTEA bytes as base64 inside the JSON napi envelope ({"$bytes": …}).
base64 = "0.23"

# MSSQL support via tiberius (optional, separate from sqlx)
# tiberius = { version = "0.12", optional = true }

[features]
default = ["sqlite", "postgres", "mysql"]
sqlite = []
postgres = []
mysql = []
# mssql = ["dep:tiberius"]
